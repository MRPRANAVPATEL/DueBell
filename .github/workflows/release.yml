name: Publish signed DueBell APK

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check release version
        shell: bash
        run: |
          version=$(sed -n 's/^duebellVersion=//p' gradle.properties)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            printf '::error::Release tag must match v%s from gradle.properties.\n' "$version"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK 34
        shell: bash
        run: bash .github/scripts/setup-android-sdk.sh

      - name: Test and build the release
        run: gradle testDebugUnitTest lintDebug assembleRelease --stacktrace

      - name: Sign and verify the release
        shell: bash
        env:
          DUEBELL_KEYSTORE: ${{ secrets.DUEBELL_KEYSTORE }}
          DUEBELL_STORE_PASSWORD: ${{ secrets.DUEBELL_STORE_PASSWORD }}
          DUEBELL_KEY_ALIAS: ${{ secrets.DUEBELL_KEY_ALIAS }}
          DUEBELL_KEY_PASSWORD: ${{ secrets.DUEBELL_KEY_PASSWORD }}
        run: |
          if [[ -z "$DUEBELL_KEYSTORE" || -z "$DUEBELL_STORE_PASSWORD" ||
                -z "$DUEBELL_KEY_ALIAS" || -z "$DUEBELL_KEY_PASSWORD" ]]; then
            echo "::error::Configure the four DueBell signing secrets listed in README.md."
            exit 1
          fi
          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/duebell-signing.XXXXXX")
          trap 'rm -rf -- "$signing_dir"' EXIT
          printf '%s' "$DUEBELL_KEYSTORE" | base64 --decode > "$signing_dir/release.jks"
          tools="$ANDROID_HOME/build-tools/34.0.0"
          "$tools/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$signing_dir/aligned.apk"
          mkdir -p dist
          "$tools/apksigner" sign --ks "$signing_dir/release.jks" \
            --ks-key-alias "$DUEBELL_KEY_ALIAS" --ks-pass env:DUEBELL_STORE_PASSWORD \
            --key-pass env:DUEBELL_KEY_PASSWORD --out dist/DueBell.apk "$signing_dir/aligned.apk"
          "$tools/apksigner" verify --verbose dist/DueBell.apk
          "$tools/zipalign" -c 4 dist/DueBell.apk

      - name: Upload the signed APK
        uses: actions/upload-artifact@v6
        with:
          name: DueBell-signed-apk
          path: dist/DueBell.apk
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the signed APK
        uses: actions/download-artifact@v8
        with:
          name: DueBell-signed-apk
          path: dist

      - name: Publish the signed APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/DueBell.apk \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "DueBell ${GITHUB_REF_NAME#v}"
